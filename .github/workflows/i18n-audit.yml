name: English and Portuguese browser acceptance
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'qa/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - '.github/workflows/i18n-audit.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'qa/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - '.github/workflows/i18n-audit.yml'
permissions:
  contents: read
jobs:
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install pinned browser runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Language acceptance with offline narrator fixtures
        run: node qa/verify-i18n.mjs
      - name: Upload screenshots and language matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-ui-and-saves
          path: qa/output/i18n/
          if-no-files-found: ignore
