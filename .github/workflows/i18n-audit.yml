name: i18n EN/PT — browser acceptance
on:
  push:
    branches: [i18n/en-us]
  pull_request:
    branches: [master]
    paths:
      - "src/i18n/**"
      - "qa/verify-i18n.mjs"
      - ".github/workflows/i18n-audit.yml"
      - "src/main.ts"
      - "src/style.css"
permissions:
  contents: read
jobs:
  validate-languages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build and TypeScript
        run: npm run build
      - name: Install browser automation
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: EN/PT language acceptance and real browser snapshots
        run: node qa/verify-i18n.mjs
      - name: Upload screenshots and language matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-ui-and-saves
          path: qa/output/i18n/
          if-no-files-found: ignore
