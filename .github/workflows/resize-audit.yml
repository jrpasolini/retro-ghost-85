name: Retro-Ghost-85 — QA de gameplay e resize
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - "qa/verify-resize.mjs"
      - "qa/verify-solo-ui.mjs"
      - ".github/workflows/resize-audit.yml"
      - "src/**"
      - "public/**"
      - "index.html"
permissions:
  contents: read
jobs:
  resize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Dependencies
        run: npm ci
      - name: Verify build
        run: npm run build
      - name: Install Playwright runner (not part of production dependencies)
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Dynamic browser resize, image projection and tokens
        run: node qa/verify-resize.mjs
      - name: Browser regression — solo penalty, save/load and Endgame
        run: node qa/verify-solo-ui.mjs
      - name: Attach screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resize-visual-evidence
          path: qa/output/resize/
          if-no-files-found: ignore
