name: Gameplay and responsive layout acceptance
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'qa/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - '.github/workflows/resize-audit.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'qa/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - '.github/workflows/resize-audit.yml'
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install pinned browser runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Resize, image projection and tokens
        run: node qa/verify-resize.mjs
      - name: Solo penalty, save/load and Endgame
        run: node qa/verify-solo-ui.mjs
      - name: Upload screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resize-visual-evidence
          path: qa/output/resize/
          if-no-files-found: ignore
