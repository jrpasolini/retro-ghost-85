name: Retro-Ghost-85 — build and tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Documentation and license checks
        run: npm run check:docs
      - name: Build and TypeScript
        run: npm run build
