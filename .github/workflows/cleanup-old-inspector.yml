name: One-time cleanup — obsolete inspector branch
on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  delete-obsolete-branch:
    if: ${{ contains(github.event.head_commit.message, 'chore(repo): retire stale inspector branch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Excluir somente o ref antigo verificado
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branch="cursor/inspector-panel-polish-0417"
          expected="9c10d3524b52068823642d83f0392559c8b825d4"
          actual="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -z "$actual" ]]; then
            echo "Branch já excluída."
            exit 0
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::A branch mudou após a conferência. Nenhuma exclusão realizada."
            exit 1
          fi
          gh api --method DELETE "repos/$repo/git/refs/heads/$branch"
          echo "Branch obsoleta excluída: $branch"
